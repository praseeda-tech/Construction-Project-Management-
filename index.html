<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction Document Control</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#0d1117;color:#e6edf3}*{box-sizing:border-box}body{margin:0}header{padding:20px max(18px,calc((100vw - 1400px)/2));background:#161b22;border-bottom:1px solid #30363d}h1{font-size:1.45rem;margin:0 0 5px}h2{font-size:1.1rem;margin:0 0 14px}h3{font-size:1rem;margin:0 0 10px}p,.muted{color:#9da7b3}main{max-width:1400px;margin:auto;padding:20px 16px 60px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#21262d}.tabs button.active{background:#234d80;border-color:#5095d8}.panel{border:1px solid #30363d;border-radius:13px;padding:17px;margin-bottom:18px;background:#11161e}button,input,select,textarea{font:inherit;color:inherit;border:1px solid #414b57;border-radius:7px;background:#1b222c;padding:9px}button{cursor:pointer}button:hover{border-color:#74a9e5}button.primary{background:#2563a6;border-color:#4389cf}button.danger{border-color:#9d4b4b}button:disabled{opacity:.45;cursor:not-allowed}label{font-size:.86rem;color:#b6c0ca;display:block;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin:14px 0}.formgrid input,.formgrid select,.formgrid textarea{width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.scroll{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:800px}.table th,.table td{text-align:left;vertical-align:top;border-bottom:1px solid #30363d;padding:11px 9px}.table th{font-size:.8rem;color:#aeb8c4;white-space:nowrap}.small{font-size:.78rem}.pill{display:inline-block;padding:3px 8px;border:1px solid #404b58;border-radius:15px;font-size:.75rem}.green{color:#49cf75}.blue{color:#67b7ff}.orange{color:#f4a340}.red{color:#ff6868}.gray{color:#aeb8c4}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.card{border:1px solid #30363d;background:#1b222c;border-radius:10px;padding:14px}.card strong{display:block;font-size:1.65rem;margin-top:7px}.progress{height:9px;background:#30363d;border-radius:10px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#3984e5}.cat{border-bottom:1px solid #30363d;padding:12px 0}.cat button{background:transparent;border:0;text-align:left;width:100%;padding:0}.milestone{padding:12px;margin:9px 0;background:#1b222c;border-radius:9px}.matrixcell{min-width:165px}.rev{border:1px solid #424c58;border-left-width:4px;border-radius:8px;padding:8px;margin-bottom:6px;font-size:.79rem}.rev.green{border-left-color:#49cf75}.rev.blue{border-left-color:#67b7ff}.rev.orange{border-left-color:#f4a340}.rev.red{border-left-color:#ff6868}.rev.gray{border-left-color:#777}.rev b{display:block}.flow{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center}.flowbox{border:1px solid #45505e;border-radius:10px;padding:14px;width:min(100%,500px);background:#1b222c}.flowbranches{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.flowbranches .flowbox{width:100%}.arrow{color:#98a7b6;font-size:22px}.hint{font-size:.83rem;color:#9da7b3}.hidden{display:none!important}.warn{border:1px solid #735a2b;background:#302716;border-radius:9px;padding:12px}.link{color:#7dbbff}a{color:#7dbbff}@media(max-width:640px){.panel{padding:12px}.flowbranches{grid-template-columns:1fr}.table{min-width:750px}}
</style></head><body><header><h1>Construction Document Control</h1><div class="muted small">Expected submittals • CRE / REC tracking • change control • milestone progress</div></header><main><div class="warn small">Prototype: data is saved in this browser only (localStorage). It is not shared with colleagues, synced with SharePoint, or stored on GitHub. Export a backup regularly.</div><nav class="tabs" id="tabs"></nav><section id="view"></section></main><script>
'use strict';
const KEY='construction-doc-control-v1';
const TYPES={
'IFC Drawings':['Design Development Drawings','Issued for Construction Drawings','Final IFC Drawings'],
'As-Built Drawings':['As-Built Drawings','Final As-Built Drawings'],
'Asset Data':['Initial Asset Data','Final Asset Data'],
'O&M Manuals':['Preliminary O&M Manuals','Final O&M Manuals'],
'Spare Parts':['Spare Parts Submittal','Final Spare Parts Verification'],
'Training Manuals':['Draft Training Manuals','Final Training Manuals'],
'Training Records':['Training Records Submission','Final Training Records Acceptance'],
'Operational Manuals':['Draft Operational Manuals','Final Operational Manuals'],
'Punch Lists':['Initial Punch List','Final Punch List']};
const DISCIPLINES=['OCS','TPSS','Communications & SCADA','Radio','Signals','Other'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({requirements:[],changes:[],locations:['Project-wide','Station A','Station B','Right of Way'],disciplines:[...DISCIPLINES]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||empty();if(!Array.isArray(state.requirements)||!Array.isArray(state.changes))throw Error('bad');}catch{state=empty()}
state.locations=state.locations||empty().locations;state.disciplines=state.disciplines||[...DISCIPLINES];
let tab='Dashboard',filterLoc='All locations',filterDisc='All disciplines',openCategory='',selectedReq='',editing=false;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const uid=()=> 'REQ-'+String(Math.max(0,...state.requirements.map(r=>Number((r.id||'').replace('REQ-',''))||0))+1).padStart(4,'0');
const stages=r=>r.stages||TYPES[r.type]||['Initial Submission','Final Submission'];
const last=(r,stage)=> (r.records||[]).filter(x=>x.stage===stage).at(-1);
const satisfied=(r,stage)=>{const x=last(r,stage);return !!(x&&x.rec&&(x.code==='1'||(stage!==stages(r).at(-1)&&x.code==='2')))};
const status=(r,stage)=>{const x=last(r,stage);if(!x)return 'Awaiting initial submission';if(!x.rec)return 'Under review';if(satisfied(r,stage))return x.code==='1'?'Accepted':'Stage satisfied (Code 2)';return 'Awaiting resubmittal'};
const color=(r,stage)=>{const x=last(r,stage);return !x?'gray':!x.rec?'blue':x.code==='1'?'green':x.code==='2'?'orange':'red'};
const icon=(r,stage)=>{const x=last(r,stage);return !x?'○':!x.rec?'◷':x.code==='1'?'✓':x.code==='2'?'↻':'✕'};
const relevant=()=>state.requirements.filter(r=>r.active!==false&&(filterLoc==='All locations'||(r.locations||[]).includes(filterLoc))&&(filterDisc==='All disciplines'||r.discipline===filterDisc));
const metrics=rows=>{let total=0,accepted=0,review=0,resubmit=0,missing=0;for(const r of rows)for(const s of stages(r)){total++;const x=status(r,s);if(x==='Accepted'||x.startsWith('Stage satisfied'))accepted++;else if(x==='Under review')review++;else if(x==='Awaiting resubmittal')resubmit++;else missing++;}return {total,accepted,review,resubmit,missing,pct:total?Math.round(accepted/total*100):0}};
const statCards=m=>`<div class="cards"><div class="card">Stage satisfied<strong class="green">${m.accepted}</strong></div><div class="card">Under review<strong class="blue">${m.review}</strong></div><div class="card">Awaiting resubmittal<strong class="orange">${m.resubmit}</strong></div><div class="card">Awaiting initial submission<strong>${m.missing}</strong></div></div><p class="small muted">${m.accepted} of ${m.total} expected milestones satisfied • ${m.resubmit+m.missing} awaiting contractor submission / resubmission</p>`;
const progress=(pct)=>`<div class="progress"><div class="fill" style="width:${pct}%"></div></div>`;
const options=(arr,val)=>arr.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');
const filters=()=>`<div class="formgrid"><div><label>Location</label><select id="locFilter">${options(['All locations',...state.locations],filterLoc)}</select></div><div><label>Discipline</label><select id="discFilter">${options(['All disciplines',...state.disciplines],filterDisc)}</select></div></div>`;
function dashboard(){const rows=relevant(),m=metrics(rows);let html=`<div class="panel"><h2>Project Documentation Dashboard</h2>${filters()}<div class="cards"><div class="card">Expected requirements<strong>${rows.length}</strong></div><div class="card">Expected milestone submissions<strong>${m.total}</strong></div><div class="card">Milestones satisfied<strong>${m.pct}%</strong></div><div class="card">Awaiting contractor submission<strong>${m.missing+m.resubmit}</strong></div></div><p class="hint">Completion is based on applicable milestones: preliminary Code 1 or 2, final Code 1 only.</p></div><div class="panel"><h2>Completion by document category and milestone</h2>`;
for(const type of Object.keys(TYPES)){const group=rows.filter(r=>r.type===type),mm=metrics(group);html+=`<div class="cat"><button data-cat="${esc(type)}"><span>${openCategory===type?'▾':'▸'} <b>${esc(type)}</b> <span style="float:right">${mm.pct}% · ${group.length} requirements</span></span>${progress(mm.pct)}</button>`;if(openCategory===type){for(const stage of TYPES[type]){const subset=group.filter(r=>stages(r).includes(stage));const ms=metrics(subset.map(r=>({...r,stages:[stage]})));html+=`<div class="milestone"><b>${esc(stage)}</b> <span style="float:right">${ms.pct}%</span>${progress(ms.pct)}<p class="small muted">${ms.accepted} satisfied · ${ms.review} under review · ${ms.resubmit} awaiting resubmittal · ${ms.missing} awaiting initial submission</p></div>`;}html+=`<p class="hint">Category totals count each required milestone once. Expand the matrix to see CRE / REC references.</p>`;}html+='</div>';}return html+`</div>`;}
function requirements(){const rows=relevant();return `<div class="panel"><div class="row between"><h2>Master Expected Submittal Register</h2><button class="primary" id="addReq">+ Add requirement</button></div><p class="hint">Start by identifying requirements from specifications. Verify each entry. Change orders can add or amend requirements later.</p>${filters()}<div id="reqForm"></div><div class="scroll"><table class="table"><thead><tr><th>ID / Requirement</th><th>Category / Discipline</th><th>Location</th><th>Source / Change</th><th>Verification</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.id)}</b><br>${esc(r.name)}</td><td>${esc(r.type)}<br><span class="muted">${esc(r.discipline)}</span></td><td>${esc((r.locations||[]).join(', '))}</td><td>${esc(r.source)}<br><span class="muted">${esc(r.change||'')}</span></td><td><select data-verify="${esc(r.id)}">${options(['Pending verification','Verified','Needs correction'],r.verification)}</select></td><td><button data-edit="${esc(r.id)}">Edit</button></td></tr>`).join('')||'<tr><td colspan="6">No requirements yet. Add your first expected submittal.</td></tr>'}</tbody></table></div></div>`;}
function reqForm(r){return `<form id="requirementForm" class="panel"><h3>${r?'Edit':'Add'} expected submittal</h3><div class="formgrid"><div><label>Requirement name *</label><input name="name" required value="${esc(r?.name||'')}" placeholder="e.g. Station A SCADA As-Builts"></div><div><label>Document category *</label><select name="type">${options(Object.keys(TYPES),r?.type||'As-Built Drawings')}</select></div><div><label>Discipline</label><select name="discipline">${options(state.disciplines,r?.discipline||'Communications & SCADA')}</select></div><div><label>Specification / contract reference *</label><input name="source" required value="${esc(r?.source||'')}" placeholder="Spec 01 33 00"></div><div><label>Change order / work directive</label><input name="change" value="${esc(r?.change||'')}" placeholder="CO-014"></div><div><label>Verification</label><select name="verification">${options(['Pending verification','Verified','Needs correction'],r?.verification||'Pending verification')}</select></div></div><label>Applicable locations (select all that apply)</label><div class="row">${state.locations.map(l=>`<label><input type="checkbox" name="location" value="${esc(l)}" ${(r?.locations||['Project-wide']).includes(l)?'checked':''}> ${esc(l)}</label>`).join('')}</div><p class="hint">Milestones are automatically assigned from the selected category. Existing submissions are preserved when editing a requirement.</p><div class="row"><button class="primary" type="submit">Save requirement</button><button type="button" id="cancelReq">Cancel</button>${r?'<button type="button" id="archiveReq" class="danger">Archive requirement</button>':''}</div></form>`;}
function matrix(){const rows=relevant();return `<div class="panel"><h2>Master CRE / REC Submittal Matrix</h2><p class="hint">Each cell shows all revisions at that milestone. Code 1 green; Code 2 orange; Code 3/4 red; pending REC blue. Click “Record CRE / REC” to update a package.</p>${filters()}<div class="scroll"><table class="table"><thead><tr><th>Requirement / Discipline</th><th>Milestones and all revisions</th><th>Update</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted small">${esc(r.id)} · ${esc(r.type)}<br>${esc(r.discipline)} · ${esc((r.locations||[]).join(', '))}</span></td><td>${stages(r).map(s=>`<div class="matrixcell"><b>${esc(s)}</b><div class="small ${color(r,s)}">${icon(r,s)} ${esc(status(r,s))}</div>${(r.records||[]).filter(x=>x.stage===s).map(x=>`<div class="rev ${!x.rec?'blue':x.code==='1'?'green':x.code==='2'?'orange':'red'}"><b>Rev ${String(x.rev).padStart(2,'0')}</b>CRE: ${esc(x.cre)}${x.creUrl?' <a href="'+esc(x.creUrl)+'" target="_blank" rel="noopener noreferrer">↗</a>':''}<br>REC: ${esc(x.rec||'Pending')}${x.recUrl?' <a href="'+esc(x.recUrl)+'" target="_blank" rel="noopener noreferrer">↗</a>':''}<br>${x.code?'Code '+esc(x.code):'Under review'}</div>`).join('')||'<p class="muted small">No submission</p>'}</div><hr style="border:0;border-top:1px solid #30363d">`).join('')}</td><td><button data-record="${esc(r.id)}">Record CRE / REC</button></td></tr>`).join('')||'<tr><td colspan="3">Add requirements in the Register to begin.</td></tr>'}</tbody></table></div><div id="recordForm"></div></div>`;}
function recordForm(r){const available=stages(r);return `<form id="creForm" class="panel"><h3>${esc(r.name)} — CRE / REC entry</h3><div class="formgrid"><div><label>Milestone</label><select name="stage" id="recordStage">${options(available,available[0])}</select></div><div><label>Action</label><select name="action" id="recordAction"><option value="cre">New incoming CRE</option><option value="rec">Respond to pending CRE</option></select></div></div><div id="recordFields"></div><div class="row"><button type="submit" class="primary">Save record</button><button type="button" id="cancelRecord">Cancel</button></div><p class="hint">Every new CRE creates the next revision within the selected milestone. A REC completes that revision's review response.</p></form>`;}
function recordFields(r){const stage=document.getElementById('recordStage').value,action=document.getElementById('recordAction').value,pending=last(r,stage);let el=document.getElementById('recordFields');if(action==='cre')el.innerHTML=`<p class="hint">Next revision: Rev ${String((pending?.rev||0)+1).padStart(2,'0')}</p><div class="formgrid"><div><label>Incoming CRE number *</label><input name="cre" required placeholder="CRE-0123"></div><div><label>CRE date</label><input name="creDate" type="date"></div><div><label>SharePoint CRE link (optional)</label><input name="creUrl" type="url" placeholder="https://..."></div></div>${pending&&!pending.rec?'<p class="orange">This milestone has an unanswered CRE. Record its REC first.</p>':''}`;else el.innerHTML=`<p class="hint">${pending&&!pending.rec?'Pending CRE: '+esc(pending.cre):'No pending CRE for this milestone.'}</p><div class="formgrid"><div><label>Outgoing REC number *</label><input name="rec" required placeholder="REC-0456"></div><div><label>Response code *</label><select name="code">${options(['1','2','3','4'],'1')}</select></div><div><label>REC date</label><input name="recDate" type="date"></div><div><label>SharePoint REC link</label><input name="recUrl" type="url" placeholder="https://..."></div></div><label>Reviewer / comments</label><textarea name="comments" rows="2" style="width:100%"></textarea>`;}
function changeView(){return `<div class="panel"><h2>Change Order / Work Directive Register</h2><p class="hint">Record a change here, then add or edit affected requirements in the Expected Submittal Register, referencing its CO / WD number. Existing CRE / REC history remains intact.</p><form id="changeForm"><div class="formgrid"><div><label>CO / WD number *</label><input name="number" required placeholder="CO-014"></div><div><label>Type</label><select name="type"><option>Change Order</option><option>Work Directive</option></select></div><div><label>Description *</label><input name="description" required></div><div><label>Date</label><input name="date" type="date"></div></div><button class="primary">Add change</button></form><div class="scroll"><table class="table"><thead><tr><th>Reference</th><th>Type</th><th>Description</th><th>Date</th><th>Linked requirements</th></tr></thead><tbody>${state.changes.map(c=>`<tr><td>${esc(c.number)}</td><td>${esc(c.type)}</td><td>${esc(c.description)}</td><td>${esc(c.date)}</td><td>${state.requirements.filter(r=>r.change===c.number).map(r=>esc(r.id)).join(', ')||'None yet'}</td></tr>`).join('')}</tbody></table></div></div>`;}
function flowView(){return `<div class="panel"><h2>Overall Construction Document Control Flow</h2><div class="flow"><div class="flowbox"><b>Notice to Proceed (NTP)</b><p class="small">Project and contract established</p></div><div class="arrow">↓</div><div class="flowbox"><b>Identify All Required Submittals</b><p class="small">Specifications • Contract • Change Orders • Work Directives</p></div><div class="arrow">↓</div><div class="flowbox"><b>Verify Master Submittal Register</b><p class="small">Document type • System • Location • Required milestones • Due dates</p></div><div class="arrow">↓</div><div class="flowbranches">${Object.keys(TYPES).map(t=>`<div class="flowbox">${esc(t)}</div>`).join('')}</div><div class="arrow">↓</div><div class="flowbox"><b>CRE / REC Submission & Approval Tracking</b><p class="small">Every required milestone tracked independently</p></div><div class="arrow">↓</div><div class="flowbox"><b>Progress Dashboard & Closeout</b><p class="small">Live completion percentages, outstanding approvals, overdue items</p></div></div></div><div class="panel"><h2>Document-type flowcharts</h2><label>Category</label><select id="flowType">${options(Object.keys(TYPES),window._flowType||'Asset Data')}</select><div id="flowDetail"></div></div>`;}
function flowDetail(){const type=document.getElementById('flowType').value;window._flowType=type;const steps=TYPES[type];let pre=type==='Asset Data'?'<div class="flowbox">Design Development Drawings approved<br><span class="hint">Initial asset data prepared while As-Builts are under review</span></div><div class="arrow">↓</div>':'';document.getElementById('flowDetail').innerHTML=`<div class="flow" style="margin-top:14px"><div class="flowbox">Identify and Verify Requirements</div><div class="arrow">↓</div>${pre}${steps.map((s,i)=>`<div class="flowbox"><b>${esc(s)}</b><p class="small">CRE → Review → REC</p><span class="${i===steps.length-1?'green':'orange'} small">${i===steps.length-1?'Code 1 required for closeout':'Code 1 or 2 allows next stage'}</span><p class="hint">${i===steps.length-1?'Code 2 / 3 / 4: revise same stage':'Code 3 / 4: revise same stage'}</p></div><div class="arrow">↓</div>`).join('')}${type==='Asset Data'?'<div class="flowbox">Final IFC / Final As-Built requirements satisfied<br><span class="hint">Verify final asset data against applicable drawings</span></div><div class="arrow">↓</div>':''}<div class="flowbox green">✓ Final Closeout Accepted</div></div>`;}
function settings(){return `<div class="panel"><h2>Locations & Disciplines</h2><p class="hint">Add stations, right-of-way segments, substations, or other project locations. Existing requirements can cover multiple locations.</p><form id="addLocation" class="row"><input name="value" required placeholder="New location (e.g. Station C)"><button>Add location</button></form><p>${state.locations.map(esc).join(' · ')}</p><form id="addDiscipline" class="row"><input name="value" required placeholder="New discipline"><button>Add discipline</button></form><p>${state.disciplines.map(esc).join(' · ')}</p></div><div class="panel"><h2>Backup & Restore</h2><p class="hint">Export a JSON backup before clearing browser data or switching devices. Import replaces the current browser's records.</p><div class="row"><button id="exportData">Export JSON backup</button><label>Import JSON backup <input id="importData" type="file" accept="application/json,.json"></label></div></div>`;}
function render(){document.getElementById('tabs').innerHTML=['Dashboard','Expected Register','CRE / REC Matrix','Flowcharts','Changes','Settings'].map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${x}</button>`).join('');document.getElementById('view').innerHTML=tab==='Dashboard'?dashboard():tab==='Expected Register'?requirements():tab==='CRE / REC Matrix'?matrix():tab==='Flowcharts'?flowView():tab==='Changes'?changeView():settings();if(tab==='Flowcharts')flowDetail();}
function bindForm(form,handler){if(form)form.addEventListener('submit',e=>{e.preventDefault();handler(new FormData(form));});}
document.addEventListener('change',e=>{if(e.target.id==='locFilter'){filterLoc=e.target.value;render()}if(e.target.id==='discFilter'){filterDisc=e.target.value;render()}if(e.target.id==='flowType')flowDetail();if(e.target.matches('[data-verify]')){const r=state.requirements.find(x=>x.id===e.target.dataset.verify);r.verification=e.target.value;save();}if(e.target.id==='recordStage'||e.target.id==='recordAction'){const r=state.requirements.find(x=>x.id===selectedReq);recordFields(r)}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.cat){openCategory=openCategory===b.dataset.cat?'':b.dataset.cat;render();return}if(b.id==='addReq'||b.dataset.edit){selectedReq=b.dataset.edit||'';const r=state.requirements.find(x=>x.id===selectedReq);document.getElementById('reqForm').innerHTML=reqForm(r);document.getElementById('reqForm').scrollIntoView({behavior:'smooth'});return}if(b.id==='cancelReq'){document.getElementById('reqForm').innerHTML='';return}if(b.id==='archiveReq'){if(confirm('Archive this requirement? Existing history is retained.')){state.requirements.find(x=>x.id===selectedReq).active=false;save();render()}return}if(b.dataset.record){selectedReq=b.dataset.record;const r=state.requirements.find(x=>x.id===selectedReq);document.getElementById('recordForm').innerHTML=recordForm(r);recordFields(r);document.getElementById('recordForm').scrollIntoView({behavior:'smooth'});return}if(b.id==='cancelRecord'){document.getElementById('recordForm').innerHTML='';return}if(b.id==='exportData'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='construction-document-control-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}});
document.addEventListener('submit',e=>{if(!['requirementForm','creForm','changeForm','addLocation','addDiscipline'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target);if(e.target.id==='requirementForm'){const type=f.get('type'),existing=state.requirements.find(x=>x.id===selectedReq),r={...(existing||{id:uid(),records:[],active:true}),name:f.get('name').trim(),type,discipline:f.get('discipline'),source:f.get('source').trim(),change:f.get('change').trim(),verification:f.get('verification'),locations:f.getAll('location'),stages:TYPES[type]};if(!r.locations.length){alert('Select at least one location.');return}if(existing&&existing.type!==type&&(existing.records||[]).length){alert('Cannot change category after submissions exist. Create a new requirement instead.');return}if(existing)Object.assign(existing,r);else state.requirements.push(r);selectedReq='';save();render();return}if(e.target.id==='creForm'){const r=state.requirements.find(x=>x.id===selectedReq),stage=f.get('stage'),action=f.get('action'),prior=last(r,stage);if(action==='cre'){if(prior&&!prior.rec){alert('Record the REC for the pending CRE first.');return}if(prior&&satisfied(r,stage)){alert('Stage already satisfied. To reopen due to a change order, create a new requirement linked to that change.');return}if(stages(r).indexOf(stage)>0){const prev=stages(r)[stages(r).indexOf(stage)-1];if(!satisfied(r,prev)){alert('Prior milestone must have Code 1 or Code 2 before proceeding.');return}}r.records.push({stage,rev:(prior?.rev||0)+1,cre:f.get('cre').trim(),creDate:f.get('creDate'),creUrl:f.get('creUrl'),rec:'',code:''})}else{if(!prior||prior.rec){alert('No unanswered CRE for this milestone.');return}Object.assign(prior,{rec:f.get('rec').trim(),code:f.get('code'),recDate:f.get('recDate'),recUrl:f.get('recUrl'),comments:f.get('comments')})}save();render();return}if(e.target.id==='changeForm'){state.changes.push({number:f.get('number').trim(),type:f.get('type'),description:f.get('description').trim(),date:f.get('date')});save();render();return}if(e.target.id==='addLocation'||e.target.id==='addDiscipline'){const list=e.target.id==='addLocation'?state.locations:state.disciplines,value=f.get('value').trim();if(value&&!list.includes(value))list.push(value);save();render();}});
document.addEventListener('change',async e=>{if(e.target.id==='importData'){const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.requirements)||!Array.isArray(data.changes))throw Error('Invalid backup format');if(confirm('Replace ALL data in this browser with this backup?')){state={...empty(),...data};save();render()}}catch(err){alert('Could not import: '+err.message)}}});
render();
</script></body></html>
